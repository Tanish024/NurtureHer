<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Previous head content remains same -->
    <style>
        /* Center the loader container */
        .loader-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: rgba(255, 255, 255, 0.8);
            z-index: 1000;
        }

        /* Make the loader bigger */
        .loader-4 {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .baby-symbol {
            position: absolute;
            width: 90px;
            height: 90px;
            background: #ff99cc;
            border-radius: 50%;
            animation: babyFloat 2s ease-in-out infinite;
        }

        .baby-symbol::before {
            content: '';
            position: absolute;
            top: 22px;
            left: 22px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: white;
            box-shadow: -12px 0 0 -6px white;
        }

        .baby-symbol::after {
            content: '👶';
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
            animation: pulse 1s ease-in-out infinite;
        }

        .sparkle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: gold;
            border-radius: 50%;
            animation: sparkle 1s infinite;
        }

        .sparkle:nth-child(1) { top: 15px; left: 30px; animation-delay: 0.2s; }
        .sparkle:nth-child(2) { top: 45px; right: 20px; animation-delay: 0.3s; }
        .sparkle:nth-child(3) { bottom: 30px; left: 60px; animation-delay: 0.6s; }

        @keyframes babyFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes sparkle {
            0% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }

        @media (max-width: 480px) {
            .loader-4 {
                width: 100px;
                height: 100px;
            }

            .baby-symbol {
                width: 60px;
                height: 60px;
            }

            .baby-symbol::before {
                top: 15px;
                left: 15px;
                width: 30px;
                height: 30px;
                box-shadow: -8px 0 0 -4px white;
            }

            .baby-symbol::after {
                bottom: -30px;
                font-size: 24px;
            }

            .sparkle {
                width: 8px;
                height: 8px;
            }

            .sparkle:nth-child(1) { top: 10px; left: 20px; }
            .sparkle:nth-child(2) { top: 30px; right: 15px; }
            .sparkle:nth-child(3) { bottom: 20px; left: 40px; }
        }
    </style>
</head>
<body>
    <!-- Update loader container -->
    <div class="loader-container" id="loaderContainer">
        <!-- Previous loaders -->
        <div class="loader loader-4 active">
            <div class="baby-symbol">
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
            </div>
        </div>
        <div class="loader loader-1"></div>
        <div class="loader loader-2"><i class="fas fa-baby"></i></div>
        
    </div>

    <script>
        // Update loader count in the rotation
        const loaders = document.querySelectorAll('.loader');
        let currentLoader = 0;
    
        function rotateLoaders() {
            loaders[currentLoader].classList.remove('active');
            currentLoader = (currentLoader + 1) % loaders.length;
            loaders[currentLoader].classList.add('active');
        }
    
        // Start cycling every 10 seconds
        const loaderInterval = setInterval(rotateLoaders, 10000);
    
        // Automatically navigate to the next page after 8 seconds
        setTimeout(() => {
            window.location.href = "dash.html"; // Replace "dash.html" with your next page URL
        }, 8000); // 8 seconds
    </script>
</body>
</html>
