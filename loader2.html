<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NurtureHer - Loading</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff758c;
            --secondary-color: #ff7eb3;
            --bg-color: #ffffff;
            --text-color: #333333;
        }

        [data-theme="dark"] {
            --primary-color: #ff4d6d;
            --secondary-color: #ff8fa3;
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 2rem;
            position: relative;
        }

        .logo {
            font-size: 3rem;
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            z-index: 2;
        }

        .logo-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
            filter: blur(30px);
            opacity: 0.3;
            border-radius: 50%;
            z-index: 1;
            animation: pulse 2s infinite;
        }

        .heart-icon {
            color: var(--primary-color);
            font-size: 3.5rem;
            animation: heartbeat 1.5s infinite;
        }

        .loading-text {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: var(--text-color);
            opacity: 0.8;
        }

        .loading-bar {
            width: 250px;
            height: 6px;
            background: rgba(255, 117, 140, 0.2);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .loading-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--secondary-color) 0%, var(--primary-color) 100%);
            border-radius: 10px;
            animation: loading 3s ease-in-out forwards;
        }

        .loading-percentage {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: var(--primary-color);
        }

        .theme-toggle {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(255, 117, 140, 0.1);
            border: none;
            color: var(--primary-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.7rem;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: rotate(20deg) scale(1.1);
            background: rgba(255, 117, 140, 0.2);
        }

        .decorative-circles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
            opacity: 0.1;
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            animation: float 8s infinite alternate;
        }

        .circle-2 {
            width: 200px;
            height: 200px;
            bottom: -100px;
            right: -100px;
            animation: float 6s infinite alternate-reverse;
        }

        .circle-3 {
            width: 150px;
            height: 150px;
            top: 50%;
            right: 10%;
            animation: float 7s infinite alternate;
        }

        .circle-4 {
            width: 100px;
            height: 100px;
            bottom: 20%;
            left: 10%;
            animation: float 5s infinite alternate-reverse;
        }

        @keyframes loading {
            0% { width: 0%; }
            20% { width: 20%; }
            50% { width: 50%; }
            80% { width: 80%; }
            100% { width: 100%; }
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.5; }
            100% { transform: scale(1); opacity: 0.3; }
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(20px) rotate(5deg); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }

            .heart-icon {
                font-size: 3rem;
            }

            .loading-bar {
                width: 200px;
            }

            .loading-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </button>

    <div class="decorative-circles">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
        <div class="circle circle-4"></div>
    </div>

    <div class="loader-container">
        <div class="logo-container">
            <div class="logo-bg"></div>
            <div class="logo">
                <i class="fas fa-heart heart-icon"></i>
                NurtureHer
            </div>
        </div>
        <div class="loading-text">Preparing your wellness journey...</div>
        <div class="loading-bar">
            <div class="loading-progress" id="progress"></div>
        </div>
        <div class="loading-percentage" id="percentage">0%</div>
    </div>

    <script>
        // Dark/Light Mode Toggle
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        themeToggle.addEventListener('click', () => {
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeToggle.innerHTML = isDark 
                ? '<i class="fas fa-moon"></i>' 
                : '<i class="fas fa-sun"></i>';
            
            // Save theme preference
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        });

        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        body.setAttribute('data-theme', savedTheme);
        themeToggle.innerHTML = savedTheme === 'dark' 
            ? '<i class="fas fa-sun"></i>' 
            : '<i class="fas fa-moon"></i>';

        // Loading progress animation
        const progress = document.getElementById('progress');
        const percentage = document.getElementById('percentage');
        let currentProgress = 0;
        
        function updateProgress() {
            if (currentProgress < 100) {
                currentProgress++;
                percentage.textContent = `${currentProgress}%`;
                
                // Adjust timing to make it feel more natural
                let delay = 30;
                if (currentProgress > 80) {
                    delay = 50; // Slow down at the end
                } else if (currentProgress > 60) {
                    delay = 40;
                } else if (currentProgress < 20) {
                    delay = 20; // Faster at the beginning
                }
                
                setTimeout(updateProgress, delay);
            } else {
                // Redirect to main page after loading completes
                setTimeout(() => {
                    window.location.href = 'blood-donation.html';
                }, 500);
            }
        }
        
        // Start the progress animation after a short delay
        setTimeout(updateProgress, 500);
        
        // Preload images and resources for the main site
        function preloadResources() {
            // You can add code here to preload key images and resources
            // This is just a simulation for the loader
            const imagesToPreload = [
                'https://images.unsplash.com/photo-1609220136736-443140cffec6',
                'https://images.unsplash.com/photo-1518611012118-696072aa579a',
                'https://images.unsplash.com/photo-1604480132736-44c188fe4d20'
            ];
            
            imagesToPreload.forEach(src => {
                const img = new Image();
                img.src = src;
            });
        }
        
        // Call preload function
        preloadResources();
    </script>
</body>
</html>
